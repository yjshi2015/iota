syntax = "proto3";

package iota.grpc.v0.event;

import "google/protobuf/struct.proto";
import "iota/grpc/v0/common.proto";

// An event.
message Event {
  // TODO: should we instead add a bcs field here, and remove it from the TransactionEvents message?

  // Package ID of the top-level function invoked by a `MoveCall` command that triggered this
  // event to be emitted.
  optional Address package_id = 1;

  // Module name of the top-level function invoked by a `MoveCall` command that triggered this
  // event to be emitted.
  optional string module = 2;

  // Address of the account that sent the transaction where this event was emitted.
  optional Address sender = 3;

  // The type of the event emitted.
  optional string event_type = 4;

  // BCS serialized bytes of the event.
  optional BcsData bcs_contents = 5;

  // JSON rendering of the event.
  // TODO: mention "type_and_fields_from_move_event_data" in the comment of the backend
  optional google.protobuf.Value json_contents = 6;
}

// A list of events.
message Events {
  repeated Event events = 1;
}